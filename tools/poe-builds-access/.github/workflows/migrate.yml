# One-off, run by hand (Actions -> Migrate to per-player repos -> Run workflow).
# Copies every poe1/<player>/ folder from POE-Builds/poe-builds into its own private repo
# POE-Builds/builds-<player> (created if missing; existing files are left alone, new ones added).
# Gives the GitHub user named <player> write access. poe-builds itself is not changed.
# Uses ORG_ADMIN_TOKEN (see builds-access.yml) - it also needs "Contents: Read and write".
name: Migrate to per-player repos
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would happen'
        type: boolean
        default: true
permissions: {}
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy player folders
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          org=POE-Builds
          git config --global user.name "POE Builds migration"
          git config --global user.email "noreply@github.com"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${org}/poe-builds.git" src
          for dir in src/poe1/*/; do
            player=$(basename "$dir")
            if ! [[ "$player" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then echo "skip $player (name)"; continue; fi
            repo="builds-${player}"
            echo "== ${player} -> ${org}/${repo} ($(find "$dir" -type f | wc -l) files)"
            [ "$DRY" = "true" ] && continue
            gh repo view "${org}/${repo}" >/dev/null 2>&1 || gh repo create "${org}/${repo}" --private --add-readme --description "${player}'s builds (Loot Goblin / PoB sync)"
            gh api -X PUT "repos/${org}/${repo}/collaborators/${player}" -f permission=push >/dev/null || echo "  (no GitHub user ${player}; add them by hand)"
            rm -rf dst
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${org}/${repo}.git" dst
            mkdir -p "dst/poe1/${player}"
            cp -rn "$dir". "dst/poe1/${player}/"
            cp src/.gitattributes dst/ 2>/dev/null || true
            cd dst
            git add -A
            git diff --cached --quiet || git commit -qm "Migrated from poe-builds"
            git push -q
            cd ..
          done
